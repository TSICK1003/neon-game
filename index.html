<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON DODGE</title>
<style>
:root{color-scheme:dark;--bg:#080b18;--panel:#11182b;--cyan:#61f3ff;--pink:#ff4fa3;--text:#edf5ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#17234b 0,#080b18 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;padding:22px}
.wrap{width:min(760px,100%)}header{text-align:center;margin-bottom:16px}
.kicker{color:var(--cyan);letter-spacing:.28em;font-size:.75rem;font-weight:800}
h1{font-size:clamp(2rem,7vw,4rem);letter-spacing:.08em;margin:6px 0;text-shadow:0 0 25px #61f3ff55}
.sub{color:#a9b8d5;margin:0}
.panel{background:#0c1223cc;border:1px solid #334366;border-radius:22px;padding:14px;box-shadow:0 20px 70px #0008}
.hud{display:flex;justify-content:space-between;gap:10px;margin:0 2px 12px}
.stat{background:#151e34;border:1px solid #283858;border-radius:12px;padding:9px 13px;flex:1}
.stat small{display:block;color:#9aabc9;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em}
.stat strong{font-size:1.25rem;color:var(--cyan)}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;border-radius:14px;border:1px solid #293858;background:#070b18;touch-action:none}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px}
button{font:inherit;font-weight:750;color:#06121c;background:var(--cyan);border:0;border-radius:12px;padding:11px 18px;cursor:pointer;box-shadow:0 5px 18px #61f3ff22}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button.secondary{background:#202c47;color:var(--text);border:1px solid #3a4a6b;box-shadow:none}
.help{color:#9eacc8;text-align:center;font-size:.88rem;line-height:1.6;margin:12px 4px 2px}
.touch{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.touch button{font-size:1.3rem;padding:10px}
footer{text-align:center;color:#6e7d9b;font-size:.75rem;margin-top:13px}
@media(max-width:560px){body{padding:12px}.panel{padding:9px}.stat{padding:7px 9px}.touch{display:grid}}
</style>
</head>
<body>
<main class="wrap">
<header><div class="kicker">ARCADE • SURVIVAL</div><h1>NEON DODGE</h1><p class="sub">피하고, 버티고, 최고 기록을 갱신하라.</p></header>
<section class="panel">
<div class="hud">
<div class="stat"><small>점수 SCORE</small><strong id="score">0</strong></div>
<div class="stat"><small>최고 기록 BEST</small><strong id="best">0</strong></div>
<div class="stat"><small>속도 LEVEL</small><strong id="level">1</strong></div>
</div>
<canvas id="game" width="900" height="600" aria-label="장애물 피하기 게임"></canvas>
<div class="controls"><button id="start">게임 시작</button><button class="secondary" id="pause">일시정지</button><button class="secondary" id="restart">다시하기</button></div>
<div class="touch"><button id="left" aria-label="왼쪽으로 이동">◀</button><button id="right" aria-label="오른쪽으로 이동">▶</button></div>
<p class="help">키보드 <b>← →</b> 또는 <b>A / D</b> 로 이동 · 떨어지는 네온 블록을 피하세요.<br>시간이 지날수록 빨라집니다. 모바일은 아래 버튼을 사용하세요.</p>
</section>
<footer>NEON DODGE · 작은 웹게임 프로젝트</footer>
</main>
<script>
(() => {
 const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
 const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level');
 const W=canvas.width,H=canvas.height;
 let best=0; try{best=Number(localStorage.getItem('neonDodgeBest')||0)}catch(e){}
 let player,blocks,particles,score,elapsed,spawnTimer,lastTime,state,keys={left:false,right:false},lastFrame=0;
 bestEl.textContent=best;
 function reset(){player={x:W/2-22,y:H-90,w:44,h:30,speed:430};blocks=[];particles=[];score=0;elapsed=0;spawnTimer=0;lastTime=0;scoreEl.textContent='0';levelEl.textContent='1';}
 function start(){if(state==='running')return; if(state==='over')reset();state='running';lastFrame=performance.now();requestAnimationFrame(loop)}
 function restart(){reset();state='ready';draw()}
 function end(){state='over';if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neonDodgeBest',best)}catch(e){}}draw()}
 function spawn(){const w=30+Math.random()*55;blocks.push({x:Math.random()*(W-w),y:-70,w,h:24+Math.random()*36,speed:190+Math.random()*100,color:Math.random()>.5?'#ff4fa3':'#a27bff'})}
 function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
 function draw(){
   ctx.clearRect(0,0,W,H);ctx.fillStyle='#070b18';ctx.fillRect(0,0,W,H);
   ctx.strokeStyle='#172442';ctx.lineWidth=1;
   for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
   for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
   for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;
   for(const b of blocks){ctx.shadowBlur=18;ctx.shadowColor=b.color;ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.shadowBlur=0;ctx.fillStyle='#ffffff55';ctx.fillRect(b.x+4,b.y+4,Math.max(0,b.w-8),3)}
   if(player){ctx.shadowBlur=24;ctx.shadowColor='#61f3ff';ctx.fillStyle='#61f3ff';ctx.beginPath();ctx.moveTo(player.x+player.w/2,player.y-8);ctx.lineTo(player.x+player.w,player.y+player.h);ctx.lineTo(player.x,player.y+player.h);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#eaffff';ctx.fillRect(player.x+player.w/2-3,player.y+8,6,12)}
   if(state!=='running'){
    ctx.fillStyle='#050817bb';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
    ctx.fillStyle='#61f3ff';ctx.font='800 48px system-ui';
    ctx.fillText(state==='over'?'GAME OVER':state==='paused'?'PAUSED':'READY?',W/2,H/2-18);
    ctx.fillStyle='#eaf3ff';ctx.font='24px system-ui';
    ctx.fillText(state==='over'?'점수: '+score+'  ·  다시하기를 눌러 재도전':state==='paused'?'일시정지 중':'게임 시작 버튼을 눌러 시작!',W/2,H/2+28);
   }
 }
 function loop(now){if(state!=='running')return;const dt=Math.min((now-lastFrame)/1000,.035);lastFrame=now;elapsed+=dt;
   const level=1+Math.floor(elapsed/12);levelEl.textContent=level;
   if(keys.left)player.x-=player.speed*dt;if(keys.right)player.x+=player.speed*dt;
   player.x=Math.max(0,Math.min(W-player.w,player.x));
   spawnTimer+=dt;if(spawnTimer>Math.max(.25,.82-elapsed*.006)){spawn();spawnTimer=0}
   for(let i=blocks.length-1;i>=0;i--){const b=blocks[i];b.y+=(b.speed+level*23)*dt;if(hit(player,b)){end();return}if(b.y>H+60)blocks.splice(i,1)}
   for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
   score=Math.floor(elapsed*10);scoreEl.textContent=score;draw();requestAnimationFrame(loop)
 }
 function togglePause(){if(state==='running'){state='paused';draw()}else if(state==='paused'){state='running';lastFrame=performance.now();requestAnimationFrame(loop)}}
 document.getElementById('start').addEventListener('click',start);
 document.getElementById('restart').addEventListener('click',restart);
 document.getElementById('pause').addEventListener('click',togglePause);
 document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key===' '&&state!=='running')start();if(e.key==='Escape')togglePause()});
 document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});
 function hold(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false))}
 hold('left','left');hold('right','right');
 canvas.addEventListener('pointermove',e=>{if(state!=='running')return;const r=canvas.getBoundingClientRect();player.x=((e.clientX-r.left)/r.width)*W-player.w/2;player.x=Math.max(0,Math.min(W-player.w,player.x))});
 reset();state='ready';draw();
})();
</script>
</body>
</html>
